name: Build Nukhba Distribution Professional V2 APK

on:
  push:
    branches: [nukhba-distribution-mobile-v2]
    paths:
      - 'nukhba-distribution-apk/**'
      - '.github/workflows/build-nukhba-distribution-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nukhba-distribution-apk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare professional V2 interface
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          grep -q 'النخبة للتوزيع' app/src/main/assets/index.html

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable APK
        run: gradle --no-daemon clean assembleDebug

      - name: Package APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Nukhba_Distribution_Mobile_Professional_V2_Trial_3_Days.apk
          sha256sum release/Nukhba_Distribution_Mobile_Professional_V2_Trial_3_Days.apk > release/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nukhba_Distribution_Mobile_Professional_V2_Trial_3_Days_APK
          path: nukhba-distribution-apk/release/*
          if-no-files-found: error
          retention-days: 7
