name: Build Paints Decor License Generator EXE

on:
  push:
    branches:
      - paint-decor-license-generator-exe-v2-2-0
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller cryptography

      - name: Validate source and license generation
        run: |
          python -m py_compile Nukhba_Paints_Decor_License_Generator_v2_2_0.py
          python -c "import Nukhba_Paints_Decor_License_Generator_v2_2_0 as g; t,p=g.build_license('NKH-PD-1234-5678-9ABC-DEF0-1234','Build Test'); assert t.startswith('NKH1.'); assert p['product_id']=='nukhba-paints-decor-owner'; print('Compatibility PASS')"

      - name: Build standalone Windows EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --noupx --name Nukhba-Paints-Decor-License-Generator-v2.2.0 --collect-all cryptography Nukhba_Paints_Decor_License_Generator_v2_2_0.py

      - name: Verify EXE and prepare release
        shell: pwsh
        run: |
          $exe = 'dist\Nukhba-Paints-Decor-License-Generator-v2.2.0.exe'
          if (-not (Test-Path $exe)) { throw 'EXE was not created' }
          $size = (Get-Item $exe).Length
          if ($size -lt 1000000) { throw 'EXE size is unexpectedly small' }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $exe 'release\Nukhba-Paints-Decor-License-Generator-v2.2.0.exe'
          Get-FileHash 'release\Nukhba-Paints-Decor-License-Generator-v2.2.0.exe' -Algorithm SHA256 | Format-List | Out-File 'release\SHA256.txt' -Encoding utf8
          @"
          مولد أكواد الصبغ والديكور — خاص بالمالك فقط
          متوافق مع تطبيق Android v2.2.0
          مدة التفعيل ثابتة: 3 أيام / 72 ساعة
          شغّل ملف EXE مباشرة، ولا يحتاج Python أو تثبيت متطلبات.
          لا ترسل هذا المولد إلى الزبون.
          "@ | Out-File 'release\اقرأني.txt' -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: Nukhba-Paints-Decor-License-Generator-v2.2.0-Windows
          path: release/*
          retention-days: 30
