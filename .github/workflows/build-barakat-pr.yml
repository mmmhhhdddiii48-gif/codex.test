name: Build Barakat APK Temporary

on:
  push:
    branches:
      - 'barakat-apk-build-*'
    paths:
      - 'barakat-trigger/**'
      - '.github/workflows/build-barakat-pr.yml'
  pull_request:
    branches: [main]
    paths:
      - 'barakat-trigger/**'
      - '.github/workflows/build-barakat-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Barakat source
        run: git clone --depth 1 --branch barakat-apk-trial-3d-20260807 https://github.com/mmmhhhdddiii48-gif/tarteeb-android-clean.git "$RUNNER_TEMP/barakat-source"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate signing key
        run: keytool -genkeypair -v -keystore "$RUNNER_TEMP/barakat-release.jks" -storepass 'Barakat2026!' -keypass 'Barakat2026!' -alias barakat -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=Barakat AlHijaz, OU=Demo, O=Barakat AlHijaz, L=Najaf, C=IQ'
      - name: Build signed APK
        env:
          BARAKAT_KEYSTORE: ${{ runner.temp }}/barakat-release.jks
          BARAKAT_STORE_PASSWORD: Barakat2026!
          BARAKAT_KEY_ALIAS: barakat
          BARAKAT_KEY_PASSWORD: Barakat2026!
        run: gradle --no-daemon -p "$RUNNER_TEMP/barakat-source/barakat_apk" clean :app:assembleRelease
      - name: Verify signature and prepare artifact
        run: |
          APK="$RUNNER_TEMP/barakat-source/barakat_apk/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          mkdir output
          cp "$APK" output/Barakat_AlHijaz_Mobile_Trial_3_Days_Install_Fix.apk
          sha256sum output/Barakat_AlHijaz_Mobile_Trial_3_Days_Install_Fix.apk > output/Barakat_AlHijaz_Mobile_Trial_3_Days_Install_Fix.apk.sha256
          cp "$RUNNER_TEMP/badging.txt" output/APK_BADGING.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Barakat_AlHijaz_Mobile_Trial_3_Days_Install_Fix
          path: output/*
          retention-days: 7
